[meta]
version = "2.0"
description = "Dev Environment Setup Config (Nushell edition)"
# anything unix is both WSL and macOS

# Common packages (installed on all platforms)
[packages.common]
git = { windows = "Git.Git", brew = "git", windows_args = "--custom '/components=\"gitlfs,assoc,autoupdate,windowsterminal\" /TASKS=\"!desktopicon,gitbashprofile\" /DEFAULTBRANCH=main /USEGITOPTIONALTOOLS=true'" }
nushell = { windows = "Nushell.Nushell", brew = "nushell" }
starship = { windows = "Starship.Starship", brew = "starship" }
miniconda = { windows = "Anaconda.Miniconda3", brew = "miniconda" }
uv = { windows = "astral-sh.uv", brew = "uv" }
jq = { windows = "jqlang.jq", brew = "jq" }
gh = { windows = "GitHub.cli", brew = "gh" }
fnm = { windows = "Schniz.fnm", brew = "fnm" }
fzf = { windows = "junegunn.fzf", brew = "fzf" }
fd = { windows = "sharkdp.fd", brew = "fd" }
zoxide = { windows = "ajeetdsouza.zoxide", brew = "zoxide" }
ripgrep = { windows = "BurntSushi.ripgrep.MSVC", brew = "ripgrep" }
lazygit = { windows = "JesseDuffield.Lazygit", brew = "lazygit" }
lazydocker = { windows = "JesseDuffield.Lazydocker", brew = "lazydocker" }
bat = { windows = "sharkdp.bat", brew = "bat" }
vscode = { windows = "Microsoft.VisualStudioCode", brew = "visual-studio-code" }
jetbrains_mono_nerd_font = { brew = "font-jetbrains-mono-nerd-font" }

# GUI-only packages (Windows desktop / macOS with display)
[packages.gui_only]
windows_terminal = { windows = "Microsoft.WindowsTerminal" }
powertoys = { windows = "Microsoft.PowerToys" }
flow_launcher = { windows = "Flow-Launcher.Flow-Launcher" }
firefox = { windows = "Mozilla.Firefox", brew = "firefox" }
sevenzip = { windows = "7zip.7zip" }
raycast = { windows = "Raycast.Raycast", brew = "raycast" }

# Personal packages (only with --personal flag)
[packages.personal]
zotero = { windows = "DigitalScholar.Zotero", brew = "zotero" }
sioyek = { windows = "ahrm.sioyek", brew = "sioyek" }

# Windows-specific packages
[packages.windows_only]
autohotkey = { windows = "AutoHotkey.AutoHotkey" }

# Unix packages (WSL and macOS)
[packages.unix_only]
tmux = { brew = "tmux" }
htop = { brew = "htop" }
neovim = { brew = "neovim" }

# WSL-specific packages
[packages.wsl_only]
build_essential = { brew = "gcc" }

# macOS-specific packages
[packages.macos_only]
aerospace = { brew = "nikitabobko/tap/aerospace" }
ghostty = { brew = "ghostty" }

# =============================================================================
# Configuration files
# =============================================================================

[files]

# Cross-platform configs
"files/.gitconfig" = "~/.gitconfig"
"files/starship.toml" = "~/.config/starship.toml"
"files/aerospace.toml" = { macos = "~/.config/aerospace/aerospace.toml" }
"files/ghostty.config" = { macos = "~/.config/ghostty/config" }
"files/env.nu" = { windows = "~/AppData/Roaming/nushell/env.nu", wsl = "~/.config/nushell/env.nu", macos = "~/Library/Application Support/nushell/env.nu" }
"files/config.nu" = { windows = "~/AppData/Roaming/nushell/config.nu", wsl = "~/.config/nushell/config.nu", macos = "~/Library/Application Support/nushell/config.nu" }

# Windows-only configs
"files/Wallpaper.jpg" = { windows = "~/Pictures/" }
"files/Lockscreen.jpg" = { windows = "~/Pictures/" }
"files/Media Keys.ahk" = { windows = "~/Documents/AutoHotkey/" }
"files/.zshrc" = { wsl = "~/.zshrc", macos = "~/.zshrc" }

# =============================================================================
# Post-install commands
# =============================================================================

[post_install.all]
fnm_lts = "fnm install --lts"
gh_auth = "gh auth login"

[post_install.windows]
ahk_startup = 'powershell -Command "$WshShell = New-Object -ComObject WScript.Shell; $shortcut = $WshShell.CreateShortcut(\"$env:APPDATA\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\Media Keys.lnk\"); $shortcut.TargetPath = \"$env:USERPROFILE\\Documents\\AutoHotkey\\Media Keys.ahk\"; $shortcut.Save()"'

[post_install.unix]
default_shell = "chsh -s (which nu)"

[post_install.macos]
wallpaper = 'let w = ($env.HOME | path join "Pictures/Wallpaper.jpg"); osascript -e $"tell application \"System Events\" to tell every desktop to set picture to POSIX file \"($w)\""'

# =============================================================================
# System config (TODO)
# =============================================================================

[system_config.windows]
enable_wsl = true
enable_hyper_v = false

[system_config.wsl]
default_shell = "nu"
