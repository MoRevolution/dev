# AeroSpace tiling window manager — Windows-style (no gaps, snapped tiles)
# ~/.aerospace.toml

after-startup-command = []
start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Layout
accordion-padding = 20
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"

# Mouse follows focus on monitor change
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]

# Unhide hidden apps (prevents cmd-h accidents)
automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = "qwerty"

# Zero gaps — Windows-style snapped tiles
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# Main keybindings
[mode.main.binding]

# Layout toggles
alt-slash = "layout tiles horizontal vertical"
alt-comma = "layout accordion horizontal vertical"
alt-f = "fullscreen"

# Focus (vim-style)
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

# Move windows
alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

# Resize
alt-minus = "resize smart -50"
alt-equal = "resize smart +50"

# Workspaces
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"

# Move window to workspace (and follow it)
alt-shift-1 = ["move-node-to-workspace 1", "workspace 1"]
alt-shift-2 = ["move-node-to-workspace 2", "workspace 2"]
alt-shift-3 = ["move-node-to-workspace 3", "workspace 3"]
alt-shift-4 = ["move-node-to-workspace 4", "workspace 4"]
alt-shift-5 = ["move-node-to-workspace 5", "workspace 5"]
alt-shift-6 = ["move-node-to-workspace 6", "workspace 6"]
alt-shift-7 = ["move-node-to-workspace 7", "workspace 7"]
alt-shift-8 = ["move-node-to-workspace 8", "workspace 8"]
alt-shift-9 = ["move-node-to-workspace 9", "workspace 9"]

# Cycle windows in current workspace (like Windows alt-tab)
alt-tab = "focus --boundaries workspace --boundaries-action wrap-around-the-workspace dfs-next"
alt-shift-tab = "focus --boundaries workspace --boundaries-action wrap-around-the-workspace dfs-prev"

# Open Ghostty
alt-shift-t = '''exec-and-forget open -a Ghostty'''

# Focus other monitor / move workspace to other monitor
alt-backtick = "focus-monitor --wrap-around next"
alt-shift-backtick = "move-workspace-to-monitor --wrap-around next"

# Service mode
alt-shift-semicolon = "mode service"

# Service mode — config reload, layout reset, float toggle
[mode.service.binding]
esc = ["reload-config", "mode main"]
r = ["flatten-workspace-tree", "mode main"]
f = ["layout floating tiling", "mode main"]
backspace = ["close-all-windows-but-current", "mode main"]

# Join windows into splits
alt-shift-h = ["join-with left", "mode main"]
alt-shift-j = ["join-with down", "mode main"]
alt-shift-k = ["join-with up", "mode main"]
alt-shift-l = ["join-with right", "mode main"]
